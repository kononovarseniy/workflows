name: Build conan package

on:
  workflow_call:
    inputs:
      conan_index_ref:
        description: The branch, tag or commit to checkout from kononovarseniy/conan-recipes-index
        default: main
        required: False
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        conf:
          - id: ubuntu-clang-18-libstdc++11
            runner: ubuntu-latest
            conan-profile: |
              [settings]
              arch=x86_64
              os=Linux
              compiler=clang
              compiler.cppstd=20
              compiler.libcxx=libstdc++11
              compiler.version=18
              build_type=Release

              [conf]
              tools.build:compiler_executables={"c": "clang-18", "cpp": "clang++-18"}

          - id: ubuntu-gcc-14-libstdc++11
            runner: ubuntu-latest
            conan-profile: |
              [settings]
              arch=x86_64
              os=Linux
              compiler=gcc
              compiler.cppstd=20
              compiler.libcxx=libstdc++11
              compiler.version=14
              build_type=Release

              [conf]
              tools.build:compiler_executables={"c": "gcc-14", "cpp": "g++-14"}

          - id: macos-apple-clang-16-libc++
            runner: macos-15
            conan-profile: |
              [settings]
              arch=armv8
              os=Macos
              compiler=apple-clang
              compiler.cppstd=20
              compiler.libcxx=libc++
              compiler.version=16
              build_type=Release

              [conf]
              tools.build:compiler_executables={"c": "clang", "cpp": "clang++"}

          - id: windows-2022
            runner: windows-2022
            conan-profile: |
              [settings]
              arch=x86_64
              os=Windows
              compiler=msvc
              compiler.cppstd=20
              compiler.version=194
              compiler.runtime=static
              compiler.runtime_type=Release
              build_type=Release

          - id: windows-2025-vs2026
            runner: windows-2025-vs2026
            conan-profile: |
              [settings]
              arch=x86_64
              os=Windows
              compiler=msvc
              compiler.cppstd=20
              compiler.version=195
              compiler.runtime=static
              compiler.runtime_type=Release
              build_type=Release

    runs-on: ${{ matrix.conf.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout conan-recipes-index
        uses: actions/checkout@v6
        with:
          repository: kononovarseniy/conan-recipes-index
          ref: ${{ inputs.conan_index_ref }}
          path: conan-recipes-index

      - name: Install conan 2
        run: pip install "conan~=2.0"

      # Loading cache to drive C: is extremly slow on windows.
      # https://github.com/actions/setup-go/issues/495
      # https://github.com/actions/setup-go/pull/515
      - name: Set CONAN_HOME (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: echo CONAN_HOME=D:/conan >> "$env:GITHUB_ENV"
      - name: Set CONAN_HOME
        if: ${{ runner.os != 'Windows' }}
        run: echo CONAN_HOME=~/.conan2 >> "$GITHUB_ENV"

      - name: Register conan-recipes-index
        run: conan remote add --index 0 ka_recipes ./conan-recipes-index

      - name: Create conan profile
        run: |
          mkdir -p ${{ env.CONAN_HOME }}/profiles
          echo '${{ matrix.conf.conan-profile }}' > ${{ env.CONAN_HOME }}/profiles/default

      - name: Show detected conan profile for debug
        run: conan profile detect --name detected

      - name: Restore conan cache
        id: restore-conan-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: ${{ matrix.conf.id }}

      - name: Install dependencies
        run: conan install . --build missing

      - name: Save conan cache
        if: steps.restore-conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: ${{ matrix.conf.id }}

      - name: Run conan create
        run: conan create .
